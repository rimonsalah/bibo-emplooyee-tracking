# Builds the Windows desktop installer for a SELF-HOSTED backend.
#
# Run it from GitHub → Actions → "Desktop: Windows installer" → Run workflow,
# enter your backend URL, then download the installer from the run's artifacts.
#
# What it changes vs. the upstream build:
#   - the app's default server is your URL (CTRACKING_DEFAULT_BACKEND_URL, read
#     at compile time in src-tauri/src/settings/mod.rs)
#   - the auto-updater checks YOUR server (<url>/download/latest.json) instead of
#     bibotracker.com, so installed PCs never silently update to the upstream
#     build. With no latest.json published there, update checks just fail quietly.
#   - no updater signing artifacts (no private key needed)
name: "Desktop: Windows installer"

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: "Backend base URL (where /healthz and /v1 respond), e.g. https://track.example.com"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      BACKEND_URL: ${{ inputs.backend_url }}
    steps:
      - name: Validate backend URL
        run: |
          url="${BACKEND_URL%/}"
          if ! [[ "$url" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?(/[A-Za-z0-9._~/-]*)?$ ]]; then
            echo "::error::backend_url must be an https:// URL, got: $BACKEND_URL"
            exit 1
          fi
          echo "BACKEND_URL=$url" >> "$GITHUB_ENV"
          echo "Building for backend: $url"

      - name: Check backend is reachable (warning only)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$BACKEND_URL/healthz" || true)
          if [ "$code" != "200" ]; then
            echo "::warning::$BACKEND_URL/healthz returned $code — the installer will build, but employees can't sign in until the backend is up."
          fi

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile --filter "@ctracking/desktop..."

      - name: Write build config override
        run: |
          node -e '
            const url = process.env.BACKEND_URL;
            const cfg = {
              bundle: { createUpdaterArtifacts: false },
              plugins: { updater: { endpoints: [url + "/download/latest.json"] } },
            };
            require("fs").writeFileSync("apps/desktop/src-tauri/selfhost.conf.json", JSON.stringify(cfg, null, 2));
          '
          cat apps/desktop/src-tauri/selfhost.conf.json

      - name: Test (with the self-hosted default baked in)
        working-directory: apps/desktop/src-tauri
        env:
          CTRACKING_DEFAULT_BACKEND_URL: ${{ env.BACKEND_URL }}
        run: cargo test --locked backend_base_url

      - name: Build installer
        working-directory: apps/desktop
        env:
          CTRACKING_DEFAULT_BACKEND_URL: ${{ env.BACKEND_URL }}
        run: pnpm tauri build --bundles nsis --config src-tauri/selfhost.conf.json

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: BiBoTracking-windows-installer
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
