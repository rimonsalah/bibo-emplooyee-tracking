<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      /* Kairo — midnight + lime, dark-first; light variant for light-mode users */
      :root {
        color-scheme: dark light;
        --bg: #0b1020;
        --bg-subtle: #121a2e;
        --border: #26304a;
        --text: #e8ecf5;
        --text-muted: #8b95ad;
        --accent: #c6f432;
        --on-accent: #0b1020;
        --success: #4ade80;
        --danger: #f87171;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #ffffff;
          --bg-subtle: #f3f5f9;
          --border: #dfe3ec;
          --text: #0b1020;
          --text-muted: #5a6478;
          --accent: #4d7c0f;
          --on-accent: #ffffff;
          --success: #16a34a;
          --danger: #dc2626;
        }
      }
      * { box-sizing: border-box; }
      body {
        width: 320px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        font-size: 13px;
        background: var(--bg);
        color: var(--text);
      }
      .head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      .brand { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
      .brand img { width: 20px; height: 20px; border-radius: 5px; display: block; }
      .pill {
        font-size: 12px; padding: 2px 8px; border-radius: 999px;
        border: 1px solid var(--border);
      }
      .pill.ok { color: var(--success); }
      .pill.bad { color: var(--danger); }
      .body { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
      .card {
        background: var(--bg-subtle); border: 1px solid var(--border);
        border-radius: 10px; padding: 12px;
      }
      .muted { color: var(--text-muted); font-size: 12px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .title { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .switch {
        width: 38px; height: 22px; border-radius: 999px; background: var(--accent);
        position: relative; cursor: pointer; border: none; flex: none;
      }
      .switch::after {
        content: ""; position: absolute; top: 2px; left: 18px;
        width: 18px; height: 18px; border-radius: 50%; background: var(--on-accent);
      }
      .switch.off { background: var(--border); }
      .switch.off::after { background: var(--text-muted); }
      .switch.off::after { left: 2px; }
      .big { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <div class="head">
      <div class="brand"><img src="icons/32.png" alt="" /> Kairo</div>
      <span id="status" class="pill">…</span>
    </div>
    <div class="body">
      <div class="row">
        <div>
          <div class="title">Track this browser</div>
          <div class="muted">Reports active tab to the local app</div>
        </div>
        <button id="toggle" class="switch"></button>
      </div>
      <div class="card">
        <div class="muted">Current page</div>
        <div id="page" class="title">—</div>
        <div id="pageMeta" class="muted"></div>
      </div>
      <div class="row">
        <div class="card" style="flex:1; margin-right:8px;">
          <div class="muted">Pages today</div>
          <div id="count" class="big">0</div>
        </div>
        <div class="card" style="flex:1;">
          <div class="muted">App port</div>
          <div id="port" class="big">—</div>
        </div>
      </div>
      <div class="muted">🔒 Only the active tab URL & time are sent — to 127.0.0.1.</div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
