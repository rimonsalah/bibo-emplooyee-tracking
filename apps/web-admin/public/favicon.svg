<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Kairo">
  <!-- Kairo mark: a clock whose ring opens at the top-right. The lime dot in the
       gap is "the moment" (kairos); the lime minute hand points at it, the short
       light hour hand makes it read as a clock. -->
  <defs>
    <linearGradient id="kairo-tile" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#18213D"/>
      <stop offset="1" stop-color="#0B1020"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#kairo-tile)"/>
  <path d="M47.01 24.02A17 17 0 1 1 28.47 15.37" fill="none" stroke="#E8ECF5" stroke-width="5" stroke-linecap="round"/>
  <path d="M32 32 38.8 35.17" fill="none" stroke="#E8ECF5" stroke-width="4" stroke-linecap="round"/>
  <path d="M32 32 35.80 23.84" fill="none" stroke="#C6F432" stroke-width="4" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.6" fill="#C6F432"/>
  <circle cx="39.18" cy="16.59" r="4.6" fill="#C6F432"/>
</svg>
